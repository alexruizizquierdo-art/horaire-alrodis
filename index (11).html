<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f5f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%20width%3D%22512%22%20height%3D%22512%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%235bb8f7%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%231778c4%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22116%22%20fill%3D%22url%28%23g%29%22/%3E%3Crect%20x%3D%2296%22%20y%3D%22120%22%20width%3D%22210%22%20height%3D%2250%22%20rx%3D%2225%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%22176%22%20y%3D%22200%22%20width%3D%22240%22%20height%3D%2250%22%20rx%3D%2225%22%20fill%3D%22%23fff%22%20fill-opacity%3D%22.88%22/%3E%3Crect%20x%3D%22116%22%20y%3D%22280%22%20width%3D%22150%22%20height%3D%2250%22%20rx%3D%2225%22%20fill%3D%22%23fff%22%20fill-opacity%3D%22.72%22/%3E%3Ccircle%20cx%3D%22360%22%20cy%3D%22352%22%20r%3D%22104%22%20fill%3D%22%231778c4%22/%3E%3Ccircle%20cx%3D%22360%22%20cy%3D%22352%22%20r%3D%2286%22%20fill%3D%22%23fff%22/%3E%3Cpath%20d%3D%22M360%20352V292M360%20352l40%2024%22%20fill%3D%22none%22%20stroke%3D%22%231778c4%22%20stroke-width%3D%2220%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%22360%22%20cy%3D%22352%22%20r%3D%2210%22%20fill%3D%22%23f5a524%22/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Horaire">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Horaire ALRODIS</title>
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#14181f;--mute:#667085;--line:#e2e8f0;--accent:#2f9bf0;--accent-d:#1778c4;--accent-s:#e5f2fe;--green:#17803d;--green-s:#e3f6ea;--amber:#b45f06;--amber-s:#fff0d9;--red:#c92a2a;--red-s:#fde8e8;--violet:#6246c7;--violet-s:#ece8fb;--teal:#0d7a6b;--teal-s:#dcf3ef;--slate:#475467;--slate-s:#e8ecf2;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 96px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.wrap.wide{max-width:1120px}
.mute{color:var(--mute)}

/* en-tête givré */
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.78);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid rgba(0,0,0,.06);padding-top:env(safe-area-inset-top)}
.hin{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.hin.wide{max-width:1120px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 8px}
.ht{min-width:0}
.ht h1{font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht p{font-size:13px;color:var(--mute)}
.hr{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:4px;padding:0 0 8px;overflow-x:auto}
.tabs button{flex:1;min-width:max-content;border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--accent-s);color:var(--accent-d)}
.tabs em{font-style:normal;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
.sync.ok i{background:#25a559}.sync.off i,.sync.test i{background:#e8a317}.sync.err i{background:var(--red)}

/* composants */
.gd{background:var(--card);border-radius:14px;margin-top:10px;box-shadow:0 0 0 1px rgba(16,24,40,.06)}.gd summary{padding:13px 16px;font-weight:700;cursor:pointer;list-style:none}.gd summary::-webkit-details-marker{display:none}.gd summary:after{content:'+';float:right;color:var(--accent-d);font-size:20px;line-height:1}.gd[open] summary:after{content:'\2212'}.gd .gb{padding:0 16px 14px;font-size:15px;line-height:1.5;color:#2b3340}.gd .gb p{margin:6px 0}.gd .gb ul,.gd .gb ol{margin:6px 0 6px 20px}.gd .gb li{margin:4px 0}.gi{margin:10px 0}.gi img{width:100%;display:block;border-radius:10px;border:1px solid var(--line)}.gi.gs img{max-width:300px;margin:0 auto}.gi figcaption{font-size:13px;color:var(--mute);margin-top:4px;text-align:center}.gtag{display:inline-block;background:var(--amber-s);color:var(--amber);border-radius:99px;font-size:12px;font-weight:700;padding:2px 10px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px rgba(16,24,40,.04);margin-top:12px}
.card h2{font-size:17px;margin-bottom:4px}
.notice{margin-top:12px;background:var(--accent-s);color:#0b4f87;border-radius:12px;padding:10px 14px;font-size:14px}
.empty-card{text-align:center;padding:28px 16px}
.empty-card p{color:var(--mute);margin-top:4px}
.empty{text-align:center;color:var(--mute);padding:32px 0}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.btn.pri{background:var(--accent);color:#fff;box-shadow:none}
.btn.pri:active{background:var(--accent-d)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent;box-shadow:none;color:var(--accent-d)}
.btn.danger{color:var(--red)}
.btn.ok{background:var(--green);color:#fff;box-shadow:none}
.btn.no{background:var(--red-s);color:var(--red);box-shadow:none}
label{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-top:12px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--green-s);color:var(--green)}.p-wait{background:var(--amber-s);color:var(--amber)}.p-no{background:var(--red-s);color:var(--red)}.p-info{background:var(--accent-s);color:var(--accent-d)}.p-draft{background:#eef1f5;color:var(--mute)}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:24px 0 10px}

/* accueil */
.brand{display:flex;align-items:center;gap:14px;padding:20px 0 4px}
.brand h1{font-size:26px;letter-spacing:-.02em}
.brand p{color:var(--mute);font-size:14px}
.logo{width:52px;height:52px;flex:none;line-height:0}.logo svg{width:52px;height:52px;display:block}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.person{border:0;background:#fff;border-radius:16px;padding:16px 12px;font-weight:700;box-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px rgba(16,24,40,.04);display:flex;flex-direction:column;align-items:center;gap:8px}
.person:active{background:var(--accent-s)}
.avc{width:44px;height:44px;border-radius:50%;background:var(--accent-s);color:var(--accent-d);display:grid;place-items:center;font-size:18px}
.mgrlink{display:block;margin:28px auto 0}
.gbtn{display:block;width:100%;margin:14px 0 4px;padding:14px}
.foot{display:flex;justify-content:center;margin-top:20px}
.pinbox{text-align:center;padding:24px 16px}
.pinbox input{max-width:220px;text-align:center;font-size:28px;letter-spacing:.5em;padding:12px 8px;margin:16px auto 0;display:block}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px}

/* navigation semaine */
.wknav{display:flex;align-items:center;justify-content:space-between;margin-top:12px;background:#fff;border-radius:14px;padding:6px;box-shadow:0 0 0 1px rgba(16,24,40,.05)}
.wkl{text-align:center;line-height:1.25}
.wkl b{display:block;font-size:16px}
.wkl span{font-size:13px;color:var(--mute)}
.ic{border:0;background:var(--accent-s);color:var(--accent-d);width:42px;height:42px;border-radius:11px;font-size:24px;line-height:1}

/* disponibilités employé */
.count{margin-top:14px;font-size:13px;color:var(--mute);font-weight:600}
.day{background:#fff;border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px rgba(16,24,40,.04)}
.day.past{opacity:.6}
.dh{display:flex;justify-content:space-between;align-items:baseline}
.dh span{color:var(--mute);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.seg button{border:0;border-radius:10px;padding:11px 1px;font-weight:600;font-size:12px;background:#f1f4f8}
.seg button.on.libre{background:var(--green);color:#fff}
.seg button.on.matin,.seg button.on.apres,.seg button.on.h{background:#e8920c;color:#fff}
.seg button.on.non{background:var(--red);color:#fff}
.locked{margin-top:10px;background:var(--violet-s);color:var(--violet);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.note{margin-top:8px!important;font-size:14px!important;padding:8px 12px!important}
.mine{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.mine:last-child{border-bottom:0}
.mine b{font-weight:600}
.lv{padding:12px 0;border-bottom:1px solid var(--line)}
.lv:last-child{border-bottom:0}
.lvh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lvn{font-size:13px;color:var(--mute);margin-top:2px}
.lva{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* grille horaire */
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--mute);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.scroll{overflow-x:auto;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px rgba(16,24,40,.05);margin-top:12px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:660px}
.grid th,.grid td{padding:4px;border-bottom:1px solid var(--line);text-align:center;font-size:13px;background:#fff}
.grid thead th{background:#f8fafc;font-weight:600}
.grid tbody tr:last-child th,.grid tbody tr:last-child td{border-bottom:0}
.hvt{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}.hz{display:flex;gap:6px;margin-left:auto}.hvt .btn.on{background:var(--accent-s);color:var(--accent-d);font-weight:700}
.grid.mth th,.grid.mth td{min-width:54px;padding:2px}.grid.mth th.nm{min-width:92px}.grid.mth .cell{min-height:40px;font-size:11px;padding:2px 1px}.grid.mth .tot{min-width:56px}
.grid.mth th.mon,.grid.mth td.mon{border-left:2px solid #cfd8e3}.grid.mth th.wkd{color:var(--red)}.grid.mth td.wkd{background:#fafbfd}
.scroll.stk{max-height:calc(100vh - 150px);overflow:auto}
.scroll.stk .grid thead th{position:sticky;top:0;z-index:3;box-shadow:0 1px 0 var(--line)}
.scroll.stk .grid thead th.nm{z-index:4}
@media (min-width:900px){.scroll.stk{max-height:none;overflow:visible;overflow:clip}.scroll.stk .grid thead th{top:var(--hh,0px)}}
.grid th.nm{position:sticky;left:0;z-index:1;text-align:left;padding:8px 10px;min-width:92px;font-weight:700;border-right:1px solid var(--line)}
.grid thead th.nm{background:#f8fafc}
.dn{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.dd{display:block;font-size:15px}
.grid tr.me th.nm{color:var(--accent-d)}
.grid tr.me td,.grid tr.me th.nm{background:#f3f9ff}
.grid td.tot,.grid th.tot{font-weight:700;min-width:56px}
.grid tr.pres td,.grid tr.pres th{background:#f8fafc;color:var(--mute);font-size:12px}
.over{color:var(--red)}
.grid.view td{height:44px;font-size:12.5px;font-weight:600}
.c-shift{color:#0b5c9e;background:var(--accent-s)!important}
.c-cm{color:var(--red);background:var(--red-s)!important}
.c-mai{color:#b45309;background:#fff4e0!important}
.hol{color:#c00000!important}
.hol small{display:block;font-size:9px;font-weight:700;line-height:1}
.c-cp,.c-leave{color:var(--violet);background:var(--violet-s)!important}
.c-fr{color:var(--teal);background:var(--teal-s)!important}
.c-fe{color:var(--slate);background:var(--slate-s)!important}
.cell{position:relative;width:100%;min-height:46px;border:0;border-radius:9px;background:#f6f8fb;display:flex;align-items:center;justify-content:center;padding:4px 2px;font-size:12px}
.cell.shift{background:var(--accent-s);color:#0b5c9e;font-weight:700}
.cell.cm{background:var(--red-s);color:var(--red);font-weight:700}
.cell.mai{background:#fff4e0;color:#b45309;font-weight:700}
.cell.cp{background:var(--violet-s);color:var(--violet);font-weight:700}
.cell.leave{background:#fff;color:var(--violet);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--violet)}
.cell.fr{background:var(--teal-s);color:var(--teal);font-weight:700}
.cell.fe{background:var(--slate-s);color:var(--slate);font-weight:700}
.cell.warn{box-shadow:inset 0 0 0 2px #e8920c}
.grid.edit td.ce{position:relative}.ok1{position:absolute;left:3px;top:3px;z-index:2;width:20px;height:20px;border-radius:50%;border:0;background:var(--green);color:#fff;font:700 12px/20px sans-serif;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.3)}.ok1:active{filter:brightness(.9)}
.cell:active{filter:brightness(.95)}
.wm{position:absolute;left:4px;top:2px;color:#d97706;font-size:12px;line-height:1.2;font-weight:800}
.hint{position:absolute;right:3px;top:3px;width:15px;height:15px;border-radius:50%;font:700 9px/15px -apple-system,sans-serif;font-style:normal;text-align:center}
.legend .hint,.legend .wm{position:static;display:inline-block}
.av-libre{background:var(--green-s);color:var(--green)}
.av-h{background:var(--amber-s);color:var(--amber)}
.avr{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-size:9px;font-weight:700;color:var(--amber)}
.nt{position:absolute;right:3px;bottom:1px;font-size:9px;color:#2563eb}
.wheelw{position:relative;margin-top:8px}
.wheel{height:220px;overflow-y:auto;scroll-snap-type:y mandatory;padding:88px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wit{height:44px;line-height:44px;text-align:center;scroll-snap-align:center;font-size:19px;font-weight:600;color:#8a96a8;transition:color .12s,font-size .12s;cursor:pointer}
.wit.sel{color:var(--ink);font-size:24px;font-weight:700}
.wsel{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:12px;background:var(--accent-s);pointer-events:none}
.wheel{position:relative;z-index:1}
.avsel{width:100%;margin-top:8px;padding:11px;border:1px solid #d5dce6;border-radius:10px;font-size:15px;background:#fff}
.tpl{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;font-weight:600}
.tpl input{flex:1;min-width:0;padding:9px;border:1px solid #d5dce6;border-radius:10px;font-size:15px}
.av-matin,.av-apres{background:var(--amber-s);color:var(--amber)}
.av-non{background:var(--red-s);color:var(--red)}
.av-leave{background:var(--violet-s);color:var(--violet)}

/* dispos vues gestion */
.dcard{background:#fff;border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px rgba(16,24,40,.04)}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.days7 div{text-align:center;font-size:11px;color:var(--mute);text-transform:uppercase}
.days7 .hint{position:static;display:block;width:auto;height:auto;font-size:14px;line-height:30px;border-radius:8px;margin-top:3px;background-clip:padding-box}
.days7 .hint.none{background:#f1f4f8;color:#aab2bf}
.nl{margin-top:8px;font-size:13px;color:#344054}
.nl li{padding:2px 0}
.nl b{display:inline-block;min-width:34px;color:var(--mute)}

/* équipe */
.etpbig{font-size:44px;font-weight:800;line-height:1.1;color:var(--blue,#0b6fd6)}
.etpbig small{font-size:18px;font-weight:700}
.card.etp .mine{margin-top:8px}
.sub{display:block;font-size:12px;color:var(--mute)}
.cpx{margin-top:10px;padding:10px;border-radius:12px;background:#f1f4f8}
.cpr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.cpf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:14px}
.cpf input{flex:1;min-width:120px;padding:8px;border:1px solid #d5dce6;border-radius:10px;font-size:14px}
.erow{padding:12px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .en{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.erow .en span{font-size:12.5px}
.erow label{margin-top:8px}
.eact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* prestations du mois */
textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-height:130px;background:#fff;color:var(--ink);resize:vertical}
.notice.warnn{background:var(--amber-s);color:var(--amber)}
.notice.warnn ul{margin-top:6px}
table.pr{border-collapse:separate;border-spacing:0;width:100%}
.pr th,.pr td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;font-size:14px;font-variant-numeric:tabular-nums;background:#fff}
.pr th:first-child,.pr td:first-child{text-align:left;position:sticky;left:0;z-index:1;min-width:88px}
.pr thead th{background:#f8fafc;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:700}
.pr tr.rw{cursor:pointer}
.pr tr.rw:active td{background:var(--accent-s)}
.pr .sub{display:block;font-size:12px;color:var(--mute);font-weight:500}
.pr .z{color:#b6bdc9}
.pr tfoot td{font-weight:700;background:#f8fafc;border-bottom:0}
.pr td.det{padding:0 12px 12px;text-align:left;background:#fbfcfe}
.dl{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;font-size:13px;padding-top:10px;position:sticky;left:0;width:calc(100vw - 72px);max-width:520px}
/* envoi : images et Excel */
.prev{display:block;width:100%;margin-top:12px;border-radius:10px;border:1px solid var(--line);background:#fff}
.sheet.wide{max-width:920px}
.xlmsg{margin-top:10px;font-size:14px}
.xlmsg li{padding:3px 0}
.xlmsg b{font-weight:700}
.okl{color:var(--green)}.wl{color:var(--amber)}
input[type=file]{width:100%;margin-top:6px;border:1px dashed var(--line);border-radius:10px;padding:12px;background:#fff;font-size:15px}
/* fiche case */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.38);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;box-shadow:0 -8px 40px rgba(15,23,42,.18)}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sh-h b{font-size:19px;display:block}
.sh-h span{color:var(--mute);font-size:14px}
.avline{margin-top:12px;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;background:#f1f4f8;color:var(--mute)}
.avline.warnl{background:var(--amber-s);color:var(--amber)}
.sheet h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 8px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pb{border:0;border-radius:12px;padding:11px 8px;background:var(--accent-s);color:#0b5c9e;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.pb small{font-weight:500;opacity:.8;font-size:12px}
.pb.on{background:var(--accent);color:#fff}
.pb.warn{background:var(--amber-s);color:var(--amber)}
.custom{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center}
.custom input{margin-top:0!important}
.typeb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typeb .btn.on{background:var(--violet);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));background:rgba(20,24,31,.92);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;white-space:nowrap}

/* impression : reprend le tableau Excel actuel */
#printArea{display:none}
.pt{border-collapse:collapse;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:12pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pt th,.pt td{border:1.5px solid #000;padding:5px 8px;text-align:center;height:28px}
.pt .jour{text-align:right;font-weight:700}
.pt .dt{font-weight:700}
.pt .grey{background:#808080;color:#fff;font-weight:700}
.pt .wkc{background:#38761d;color:#fff;font-weight:700;text-align:left}
.pt .nm{background:#00b0f0;font-weight:700;text-align:left}
.pt .nm.abs{background:#ff0000;color:#fff}
.pt .tt{background:#00b0f0;font-weight:700}
.pt .cmc{color:#000;font-weight:700}
.ptn{font-family:Arial,sans-serif;font-size:10pt;margin-top:8px}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{background:#fff}
  #app,.toast{display:none!important}
  #printArea{display:block}
}
@media (max-width:420px){
  .ht h1{font-size:18px}
  .seg button{font-size:11px}
}

function seedDemo(){
  var L=TEAM0.split('\n'),j,p,k,o;
  S={employees:{},weeks:{},leaves:{},cfg:{}};
  for(j=0;j<L.length;j++){
    p=L[j].split(':');k=(p[1]||'').toLowerCase().replace(/[^a-z]/g,'');
    o={n:p[0],o:j+1,a:true};if(CMAP[k])o.c=CMAP[k];
    S.employees['e'+(j+1)]=o;}
}
function isOldDemo(){
  var o=(S&&S.employees)||{},k,n=0,demo={camille:1,'noé':1,'léa':1,sam:1,jade:1,lou:1,max:1,direction:1};
  for(k in o){if(!o.hasOwnProperty(k))continue;n++;if(!o[k]||!demo[String(o[k].n||'').toLowerCase()])return false;}

function initData(){
  var raw=lsGet(LS_DATA);

  if(typeof FIREBASE_CONFIG!=='undefined'&&FIREBASE_CONFIG&&typeof firebase!=='undefined'){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      ref=firebase.database().ref(DB_ROOT);useFb=true;syncState='off';
      ref.on('value',function(snap){S=snap.val()||{};lsSet(LS_DATA,JSON.stringify(S));loaded=true;scheduleRender();},function(){setSync('err');});

 semaine en haut, puis l’horaire de toute l’équipe.</figcaption></figure><p>L’onglet <b>Horaire</b> montre l’horaire de la semaine, <b>dès que Fabienne l’a publié</b>. Tant qu’il n’est pas publié, rien n’est affiché : c’est normal.</p><p>Codes utilisés : <b>M</b> = matin, <b>CP</b> = congé payé, <b>FR</b> = férié, <b>F</b> = fermé / repos, <b>CM</b> = certificat médical. Les jours fériés belges sont repérés automatiquement.</p></div></details><details class=\"gd\"><summary>5. Pauses</summary><div class=\"gb\"><p>Une pause de <b>15 minutes</b> est déduite uniquement si la journée de travail dépasse <b>6 heures</b>, conformément à la loi belge.</p></div></details><details class=\"gd\"><summary>6. Questions fréquentes</summary><div class=\"gb\"><ul><li><b>Je me suis trompé dans mes dispos</b> : retournez dans « Mes dispos » et modifiez, tant que l’horaire de la semaine n’est pas fait.</li><li><b>Je ne vois pas l’horaire</b> : il n’est pas encore publié.</li><li><b>Mon prénom n’est pas dans la liste</b> : prévenez la gestion.</li><li><b>Personne d’autre ne peut modifier mes dispos ni mes congés</b>, à part la gestion.</li></ul></div></details>";

ut à droite de chaque case : dispo déclarée (L, M, A, H, pas dispo). « ! » = horaire hors dispo, crayon = note de l’employé.' loading='lazy'><figcaption>Grille de la semaine. Pastilles en haut à droite de chaque case : dispo déclarée (L, M, A, H, pas dispo). « ! » = horaire hors dispo, crayon = note de l’employé.</figcaption></figure><ul><li><b>Semaine / Mois complet</b> : les deux boutons en haut de l’onglet Horaire permettent de voir toute la semaine ou tout le mois d’un coup (les jours restent figés en haut). Les cases du mois se modifient aussi d’un toucher. Les boutons <b>−</b> / <b>+</b> réduisent ou agrandissent le tableau, et <b>Tout le mois</b> l’ajuste à l’écran pour voir les 31 jours d’un coup. Publier, imprimer et valider les dispos se font en vue Semaine.</li><li><b>Activité</b> : l’onglet « Activité » liste ce que le personnel a fait (dispos remplies, demandes de congé) ; le badge rouge indique le nombre de nouveautés depuis votre dernière visite sur cet appareil. Il n’y a pas de notification sur le téléphone : ouvrez l’application pour voir les nouveautés.</li><li><b>Validation rapide</b> : quand un employé a donné des dispos en heures (ex. 14h-20h) pour un jour encore vide, un <b>✓ vert</b> apparaît dans la case : un seul toucher place cet horaire. Le bouton « Valider toutes les dispos en heures » le fait pour toute la semaine (les jours de congé, hors contrat ou déjà remplis sont ignorés). Vous pouvez toujours toucher la case pour choisir un autre horaire.</li><li>Chaque case affiche l’horaire, avec une pastille si l’employé a laissé une précision.</li><li><b>Alertes</b> : « hors disponibilité » (l’horaire placé est en dehors de ce que l’employé a indiqué) et « hors période de contrat ».</li><li>Pause de 15 min déduite seulement pour un horaire de plus de 6 h (fin à :15).</li><li><b>MAI</b> = maladie injustifiée : compté comme absence, <b>non payé</b>, exclu des heures payées.</li><li>Jours fériés belges : détectés automatiquement (FERIE dans l’image, l’en-tête et l’Excel).</li></ul></div></details><details class=\"gd\"><summary>4. Onglet Prestations et exports Excel</summary><div class=\"gb\"><figure class='gi'><img src='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAKAA4QDASIAAhEBAxEB/8QAGwABAQADAQEBAAAAAAAAAAAAAAIBAwQFBgf/xABJEAABAwIEAwUGBAUEAQIEBQUAAQIDBBEFEhOSIVFSBjFhkeEUMkFxodEWIlPBBxWBsdIjM0JiJHKyNTZDdHWCg+Lxk6SzwvD/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAYF/8QALxEBAAIBAgQFAwMFAQEAAAAAAAERAgMEEhQhMRNRUtHwImFxQaHBMkKBsfEF4f/aAAwDAQACEQMRAD8A/bwAVAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH51jHaztFjHaiq7O9ioaVjqJP8Ayq2q4ta7usnf8eHcqqqL8EOzshjnahmPS4D2toEdIkepDiFNGuk/wVbW58u61j5zAcVpew/8Re01N2gctNBisvtNPUvaqtVMznIl0/8AWqX5tNHZWrxTEe3Ps2BdpsTxbC6Wle+eeocqMWRWua1LL3/mVq/0XkUff4h297LYdiK4fWYzAypR2VzUa5zWryc5EVqL814HoYz2hwjA6OOrxSvhp4Jf9tyrmz/H8qJdV/ofhnZuOFvZbFaHFMdwrDZNWRtXT1tFqVKu7rtW+ZV5WTgtz6TGKDD6bCexip2lbT4hTMctDW1NI5IJWXumbPwZZMqJfy7lRQ+7qu3mAfhytxmgxGGoipm2sjXX1F9xrm2zJdeF7Hz1N/ECPtB2CxCugxKHCMTpmt136EkjafNJlZ/xW+ZE+F7XPN7PY1Niy9rsNqqPCaurjoJHuxTDI0y1K5bIiu/5Lx4fJfmePSVlFL/AOupYJoXVcDma8bVT function guideMgr(){
  return '<div class="card"><span class="gtag">Réservé à la gestion</span><h2 style="margin-top:6px">Guide de l’espace gestion</h2><p class="mute">Alex et Fabienne uniquement : le personnel n’y a pas accès.</p></div>'+GUIDE_MGR;}
var deferredInstall=null;
function isStandalone(){try{return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}catch(e){return false;}}

window.addEventListener('appinstalled',function(){deferredInstall=null;scheduleRender();});
function installHtml(){
  var ua=navigator.userAgent||'';
  if(isStandalone()||location.protocol.indexOf('http')!==0)return '';
  if(deferredInstall)return '<button class="btn pri mgrlink" data-act="install" style="margin-top:18px">Installer l’application</button>';
  if(/iPhone|iPad|iPod/.test(ua))return '<div class="notice" style="margin-top:18px">Pour installer l’application : touchez <b>Partager</b> (carré avec une flèche), puis <b>Sur l’écran d’accueil</b>.</div>';
  return '';}
function whoList(){return empsPub().slice().sort(function(x,y){return x.n.localeCompare(y.n,'fr',{sensitivity:'base'});});}

  var has=mgr?getp(S,['cfg','mgr']):e.pin,title,sub;

/* ---------- ETP : équivalents temps plein, exacts sur n'importe quelle période ----------
   Chaque jour appartient à une seule période : ETP = heures de la période ÷ (temps plein hebdo × nb de jours ÷ 7).
   Une semaine à cheval sur deux mois est donc coupée au jour près. */
function ftwH(){return +getp(S,['cfg','ftw'])||38;}
function etpMin(f,t){
  var r={ag:0,ot:0,agA:0,otA:0,days:0},d=f,list=allEmps().filter(function(e){return e.c!=='gerant';}),i,e,sh,c,m;
  while(d<=t){
    r.days++;
    for(i=0;i<list.length;i++){e=list[i];if(e.out&&d>e.out)continue;sh=entryOn(e.id,d);if(!sh)continue;
      if(sh.a){m=shiftMin(sh);if(isAgency(e.c))r.ag+=m;else r.ot+=m;}
      else{c=absCode(sh);if(c&&c!=='MAI'&&!(e.mu&&d>=e.mu)){m=Math.round(absH(sh)*60);if(isAgency(e.c))r.agA+=m;else r.otA+=m;}}}
    d=addDays(d,1);}
  return r;}
/* ETP contractuel (comparaison avec le bilan social) : heures de contrat par semaine ÷ temps plein, moyenne jour par jour sur la période.
   Personnel ALRODIS seulement (hors agence, hors gérants) ; un contrat suspendu (maladie, mutuelle) compte tant que la personne n'est pas sortie. */
function etpContract(f,t){
  var list=allEmps().filter(function(e){return e.c!=='gerant'&&!isAgency(e.c);}),d=f,days=0,sum=0,ft=ftwH(),i,e,miss={},cnt={};
  while(d<=t){
    days++;
    for(i=0;i<list.length;i++){e=list[i];
      if(e.out&&d>e.out)continue;
      if(!e.a&&!e.out)continue;
      if(!inContract(e,d))continue;
      if(e.h>0){sum+=e.h/ft;cnt[e.id]=1;}else{miss[e.id]=e.n;}}
    d=addDays(d,1);}
  return {etp:days?sum/days:0,n:Object.keys(cnt).length,miss:Object.keys(miss).filter(function(k){return !cnt[k];}).map(function(k){return miss[k];})};}
function etpAllMin(r){return r.ag+r.ot+r.agA+r.otA;}
function etpVal(min,days){return days>0?min/60/(ftwH()*days/7):0;}
function etpBounds(){
  var m=V.em,y,ym,l;
  if(m==='week')return {f:V.ewk,t:addDays(V.ewk,6),l:'Semaine '+isoWeek(V.ewk)+' · '+weekRange(V.ewk)};
  if(m==='year')return {f:V.eyr+'-01-01',t:V.eyr+'-12-31',l:'Année '+V.eyr};
  if(m==='custom'){if(V.ef&&V.et&&V.ef<=V.et)return {f:V.ef,t:V.et,l:'Du '+dmy(V.ef)+' au '+dmy(V.et)};return null;}
  ym=V.emo;y=ym.split('-');return {f:ym+'-01',t:monthDays(ym)[monthDays(ym).length-1],l:MONF[+y[1]-1]+' '+y[0]};}

  }else{

    while(w<=wEnd&&ri<60){
      rr=etpMin(w,addDays(w,6));mm=etpMin(w>b.f?w:b.f,addDays(w,6)<b.t?addDays(w,6):b.t);
      if(etpAllMin(rr))rows+='<tr><td>S'+isoWeek(w)+'<span class="sub">'+weekRange(w)+(mm.days<7?' · '+mm.days+' j dans la période':'')+'</span></td><td>'+fmtH(etpAllMin(rr))+' h</td><td><b>'+fmtN(etpVal(etpAllMin(rr),7))+'</b></td></tr>';

function startSession(role,id){

function onLogin(val){

  if(mgr?!/^\d{4,8}$/.test(val):!/^\d{4}$/.test(val)){V.pinErr=mgr?'Le code doit contenir 4 à 8 chiffres.':'Le code doit contenir 4 chiffres.';render();return;}

    else{V.pinErr='Code incorrect.';render();}

    put(mgr?'cfg/mgr':'employees/'+e.id+'/pin',hashPin(val));

function setAvail(d,s){

function isPreset(av){var i;for(i=0;i<PRESETS.length;i++){if(av.a===PRESETS[i][0]&&av.b===PRESETS[i][1])return true;}return false;}

function cpAdd(id){

function allLibre(){

function readHours(){var el=byId('ah'),v=el?parseFloat(String(el.value).replace(',','.')):8;if(!(v>=0))v=8;if(v>24)v=24;return Math.round(v*4)/4;}

function dlCsv(rows,fname){
  var txt='﻿'+rows.map(function(r){return r.map(function(c){c=String(c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(';');}).join('\r\n');
  try{
    var url=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');
    a.href=url;a.download=fname;document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
  }catch(err){toast('Export impossible sur cet appareil');}}
function csv(){
  var wk=V.wk,rows=[],head=['Employé'],d;
  for(d=0;d<7;d++){var dt=parse(addDays(wk,d));head.push(DS[d]+' '+pad(dt.getDate())+'/'+pad(dt.getMonth()+1));}
  head.push('Total (h)');rows.push(head);
  emps().forEach(function(e){var r=[e.n],dd,tm=weekMin(wk,e.id);for(dd=0;dd<7;dd++)r.push(cellInfo(wk,e,dd).txt);r.push(tm?fmtH(tm):'');rows.push(r);});
  dlCsv(rows,'horaire-sem'+isoWeek(wk)+'.csv');}
function prestCsv(){
  var ym=V.mo,rows=[['Employé','Contrat','Heures prestées','Jours prestés','Maladie (h)','Congés payés (h)','Fériés récupérés (h)','Fériés (h)','Maladie injustifiée (h)']];

function importTeam(){
  var el=byId('impt'),lines=(el?el.value:'').split(/\r?\n/),mx=0,n=0,have={},i,p,nm,k,o,
    map=CMAP;
  allEmps().forEach(function(e){if(e.o>mx)mx=e.o;have[e.n.toLowerCase()]=1;});
  for(i=0;i<lines.length;i++){
    p=lines[i].split(/[:;,]/);nm=p[0].replace(/^\s+|\s+$/g,'');

function act(a,el){
  var d=el.getAttribute('data-d'),e=el.getAttribute('data-e'),id=el.getAttribute('data-id'),v=el.getAttribute('data-v');
  switch(a){
    case 'wheel-tap':{var wk2=+el.getAttribute('data-k'),wh=byId('wheel');if(wh){if(wk2===Math.round(wh.scrollTop/44))act('wheel-ok',el);else{V.whoIdx=wk2;try{wh.scrollTo({top:wk2*44,behavior:'smooth'});}catch(e3){wh.scrollTop=wk2*44;}}}break;}
    case 'wheel-ok':{var wh2=byId('wheel'),wl2=whoList(),k3=wh2?Math.round(wh2.scrollTop/44):V.whoIdx,w3=wl2[Math.max(0,Math.min(k3,wl2.length-1))];if(w3){V.whoIdx=0;V.screen='login';V.loginFor=w3.id;V.pinStep=0;V.pinTmp='';V.pinErr='';render();}break;}
    case 'pick':V.screen='login';V.loginFor=id;V.pinStep=0;V.pinTmp='';V.pinErr='';render();break;
    case 'login-mgr':V.screen='login';V.loginFor='mgr';V.pinStep=0;V.pinTmp='';V.pinErr='';render();break;
    case 'guide-home':V.screen='guide';render();break;
    case 'home':V.screen='home';V.loginFor=null;render();break;
    case 'logout':lsDel(LS_SESS);V.screen='home';V.sheet=null;V.loginFor=null;render();break;
    case 'install':if(deferredInstall){var di=deferredInstall;deferredInstall=null;try{di.prompt();}catch(e1){}render();}break;
    case 'bk-dl':bkDownload();break;
    case 'log-go':V.mgrTab=v;if(el.getAttribute('data-w'))V.wk=el.getAttribute('data-w');V.actSeen=undefined;render();break;
    case 'tab':if(V.screen==='emp')V.empTab=el.getAttribute('data-t');else{V.mgrTab=el.getAttribute('data-t');V.actSeen=(V.mgrTab==='activite')?seenGet():undefined;}V.sheet=null;render();break;
    case 'hv':V.hv=v;V.sheet=null;if(v==='m')V.hmo=iso(addDaysD(parse(V.wk),3)).slice(0,7);else if(V.hmo&&iso(addDaysD(parse(V.wk),3)).slice(0,7)!==V.hmo){var mm=V.hmo.split('-');V.wk=iso(mondayOf(new Date(+mm[0],+mm[1]-1,1)));}render();break;
    case 'hz':{var z=V.hz,sc,tb;
      if(v==='-')z=Math.max(0.15,Math.round((z-0.15)*100)/100);
      else if(v==='+')z=Math.min(2,Math.round((z+0.15)*100)/100);
      else{V.hz=1;render();sc=document.querySelector('.scroll.stk');tb=sc&&sc.querySelector('table');z=(sc&&tb&&tb.offsetWidth)?Math.max(0.15,Math.min(1,Math.floor(sc.clientWidth/tb.offsetWidth*100)/100)):1;}
      V.hz=z;render();break;}
    case 'hmo':V.hmo=addMonth(V.hmo,+el.getAttribute('data-n'));V.sheet=null;render();break;
    case 'mcell':{var dd2=parse(el.getAttribute('data-date'));V.wk=iso(mondayOf(dd2));V.sheet={e:e,d:(dd2.getDay()+6)%7};render();break;}
    case 'wk':V.wk=addDays(V.wk,7*(+el.getAttribute('data-n')));V.sheet=null;render();break;
    case 'av':setAvail(+d,el.getAttribute('data-s'));break;
    case 'all-libre':allLibre();break;
    case 'cell':V.sheet={e:e,d:+d};render();break;
    case 'sheet-close':V.sheet=null;render();break;
    case 'av-ok':{var ee=empById(el.getAttribute('data-e')),dn=+el.getAttribute('data-d'),r1=ee&&avOk(V.wk,ee,dn);if(r1){put('weeks/'+V.wk+'/shifts/'+ee.id+'/d'+dn,{a:r1.a,b:r1.b});}break;}
    case 'av-all':{var pl=avPending(V.wk),q,ee2,r2,n2=0;for(q=0;q<pl.length;q++){ee2=empById(pl[q][0]);r2=avOk(V.wk,ee2,pl[q][1]);if(r2){put('weeks/'+V.wk+'/shifts/'+ee2.id+'/d'+pl[q][1],{a:r2.a,b:r2.b});n2++;}}toast(n2+' horaire(s) validé(s)');break;}
    case 'preset':{var p=v.split('|');setShift({a:p[0],b:p[1]});break;}
    case 'type':setShift({t:v,h:readHours()});break;
    case 'clear':setShift(null);break;
    case 'custom':{var s=byId('cs').value,en=byId('ce').value;if(!s||!en||s===en){toast('Indiquez une heure de début et de fin');break;}setShift({a:s,b:en});break;}
    case 'publish':{var pub=!!getp(S,['weeks',V.wk,'pub']);put('weeks/'+V.wk+'/pub',pub?null:true);toast(pub?'Horaire dépublié':'Horaire publié');break;}
    case 'copy-prev':copyPrev();break;
    case 'print':render();window.print();break;
    case 'csv':csv();break;
    case 'lv-ok':put('leaves/'+id+'/s','ok');toast('Congé accepté');break;

    case 'pin-reset':if(confirm('Réinitialiser le code ? L’employé en créera un nouveau à sa prochaine connexion.')){put('employees/'+id+'/pin',null);toast('Code réinitialisé');}break;
    case 'archive':if(confirm('Retirer cet employé de l’équipe ? Son historique est conservé (horaires, prestations et ETP passés).'))put('employees/'+id+'/a',false);break;

    case 'ep-nav':(function(n){if(V.em==='week')V.ewk=addDays(V.ewk,7*n);else if(V.em==='year')V.eyr+=n;else V.emo=addMonth(V.emo,n);})(+el.getAttribute('data-n'));render();break;

    {v=hrs({s:'h',n:cur.n||''},cur);v[t.getAttribute('data-k')]=t.value;
      if(v.a&&v.b&&toMin(v.b)<=toMin(v.a)){toast('L’heure de fin doit être après le début');render();return;}
      put('weeks/'+V.wk+'/avail/'+me.id+'/d'+x,v);toast('Enregistré');}
