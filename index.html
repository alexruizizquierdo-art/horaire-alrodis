<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f5f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%20width%3D%22512%22%20height%3D%22512%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%235bb8f7%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%231778c4%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22116%22%20fill%3D%22url%28%23g%29%22/%3E%3Crect%20x%3D%2296%22%20y%3D%22120%22%20width%3D%22210%22%20height%3D%2250%22%20rx%3D%2225%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%22176%22%20y%3D%22200%22%20width%3D%22240%22%20height%3D%2250%22%20rx%3D%2225%22%20fill%3D%22%23fff%22%20fill-opacity%3D%22.88%22/%3E%3Crect%20x%3D%22116%22%20y%3D%22280%22%20width%3D%22150%22%20height%3D%2250%22%20rx%3D%2225%22%20fill%3D%22%23fff%22%20fill-opacity%3D%22.72%22/%3E%3Ccircle%20cx%3D%22360%22%20cy%3D%22352%22%20r%3D%22104%22%20fill%3D%22%231778c4%22/%3E%3Ccircle%20cx%3D%22360%22%20cy%3D%22352%22%20r%3D%2286%22%20fill%3D%22%23fff%22/%3E%3Cpath%20d%3D%22M360%20352V292M360%20352l40%2024%22%20fill%3D%22none%22%20stroke%3D%22%231778c4%22%20stroke-width%3D%2220%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%22360%22%20cy%3D%22352%22%20r%3D%2210%22%20fill%3D%22%23f5a524%22/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Horaire">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Horaire ALRODIS</title>
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#14181f;--mute:#667085;--line:#e2e8f0;--accent:#2f9bf0;--accent-d:#1778c4;--accent-s:#e5f2fe;--green:#17803d;--green-s:#e3f6ea;--amber:#b45f06;--amber-s:#fff0d9;--red:#c92a2a;--red-s:#fde8e8;--violet:#6246c7;--violet-s:#ece8fb;--teal:#0d7a6b;--teal-s:#dcf3ef;--slate:#475467;--slate-s:#e8ecf2;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 96px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.wrap.wide{max-width:1120px}
.mute{color:var(--mute)}

/* en-tête givré */
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.78);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid rgba(0,0,0,.06);padding-top:env(safe-area-inset-top)}
.hin{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.hin.wide{max-width:1120px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 8px}
.ht{min-width:0}
.ht h1{font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht p{font-size:13px;color:var(--mute)}
.hr{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:4px;padding:0 0 8px;overflow-x:auto}
.tabs button{flex:1;min-width:max-content;border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--accent-s);color:var(--accent-d)}
.tabs em{font-style:normal;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px}
.sync{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
.sync.ok i{background:#25a559}.sync.off i,.sync.test i{background:#e8a317}.sync.err i{background:var(--red)}

/* composants */
.gd{background:var(--card);border-radius:14px;margin-top:10px;box-shadow:0 0 0 1px rgba(16,24,40,.06)}.gd summary{padding:13px 16px;font-weight:700;cursor:pointer;list-style:none}.gd summary::-webkit-details-marker{display:none}.gd summary:after{content:'+';float:right;color:var(--accent-d);font-size:20px;line-height:1}.gd[open] summary:after{content:'\2212'}.gd .gb{padding:0 16px 14px;font-size:15px;line-height:1.5;color:#2b3340}.gd .gb p{margin:6px 0}.gd .gb ul,.gd .gb ol{margin:6px 0 6px 20px}.gd .gb li{margin:4px 0}.gi{margin:10px 0}.gi img{width:100%;display:block;border-radius:10px;border:1px solid var(--line)}.gi.gs img{max-width:300px;margin:0 auto}.gi figcaption{font-size:13px;color:var(--mute);margin-top:4px;text-align:center}.gtag{display:inline-block;background:var(--amber-s);color:var(--amber);border-radius:99px;font-size:12px;font-weight:700;padding:2px 10px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px rgba(16,24,40,.04);margin-top:12px}
.card h2{font-size:17px;margin-bottom:4px}
.notice{margin-top:12px;background:var(--accent-s);color:#0b4f87;border-radius:12px;padding:10px 14px;font-size:14px}
.empty-card{text-align:center;padding:28px 16px}
.empty-card p{color:var(--mute);margin-top:4px}
.empty{text-align:center;color:var(--mute);padding:32px 0}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.btn.pri{background:var(--accent);color:#fff;box-shadow:none}
.btn.pri:active{background:var(--accent-d)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent;box-shadow:none;color:var(--accent-d)}
.btn.danger{color:var(--red)}
.btn.ok{background:var(--green);color:#fff;box-shadow:none}
.btn.no{background:var(--red-s);color:var(--red);box-shadow:none}
label{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-top:12px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--green-s);color:var(--green)}.p-wait{background:var(--amber-s);color:var(--amber)}.p-no{background:var(--red-s);color:var(--red)}.p-info{background:var(--accent-s);color:var(--accent-d)}.p-draft{background:#eef1f5;color:var(--mute)}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:24px 0 10px}

/* accueil */
.brand{display:flex;align-items:center;gap:14px;padding:20px 0 4px}
.brand h1{font-size:26px;letter-spacing:-.02em}
.brand p{color:var(--mute);font-size:14px}
.logo{width:52px;height:52px;flex:none;line-height:0}.logo svg{width:52px;height:52px;display:block}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.person{border:0;background:#fff;border-radius:16px;padding:16px 12px;font-weight:700;box-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px rgba(16,24,40,.04);display:flex;flex-direction:column;align-items:center;gap:8px}
.person:active{background:var(--accent-s)}
.avc{width:44px;height:44px;border-radius:50%;background:var(--accent-s);color:var(--accent-d);display:grid;place-items:center;font-size:18px}
.mgrlink{display:block;margin:28px auto 0}
.gbtn{display:block;width:100%;margin:14px 0 4px;padding:14px}
.foot{display:flex;justify-content:center;margin-top:20px}
.pinbox{text-align:center;padding:24px 16px}
.pinbox input{max-width:220px;text-align:center;font-size:28px;letter-spacing:.5em;padding:12px 8px;margin:16px auto 0;display:block}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px}

/* navigation semaine */
.wknav{display:flex;align-items:center;justify-content:space-between;margin-top:12px;background:#fff;border-radius:14px;padding:6px;box-shadow:0 0 0 1px rgba(16,24,40,.05)}
.wkl{text-align:center;line-height:1.25}
.wkl b{display:block;font-size:16px}
.wkl span{font-size:13px;color:var(--mute)}
.ic{border:0;background:var(--accent-s);color:var(--accent-d);width:42px;height:42px;border-radius:11px;font-size:24px;line-height:1}

/* disponibilités employé */
.count{margin-top:14px;font-size:13px;color:var(--mute);font-weight:600}
.day{background:#fff;border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px rgba(16,24,40,.04)}
.day.past{opacity:.6}
.dh{display:flex;justify-content:space-between;align-items:baseline}
.dh span{color:var(--mute);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.seg button{border:0;border-radius:10px;padding:11px 1px;font-weight:600;font-size:12px;background:#f1f4f8}
.seg button.on.libre{background:var(--green);color:#fff}
.seg button.on.matin,.seg button.on.apres,.seg button.on.h{background:#e8920c;color:#fff}
.seg button.on.non{background:var(--red);color:#fff}
.locked{margin-top:10px;background:var(--violet-s);color:var(--violet);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.note{margin-top:8px!important;font-size:14px!important;padding:8px 12px!important}
.mine{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.mine:last-child{border-bottom:0}
.mine b{font-weight:600}
.lv{padding:12px 0;border-bottom:1px solid var(--line)}
.lv:last-child{border-bottom:0}
.lvh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lvn{font-size:13px;color:var(--mute);margin-top:2px}
.lva{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* grille horaire */
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--mute);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.scroll{overflow-x:auto;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px rgba(16,24,40,.05);margin-top:12px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:660px}
.grid th,.grid td{padding:4px;border-bottom:1px solid var(--line);text-align:center;font-size:13px;background:#fff}
.grid thead th{background:#f8fafc;font-weight:600}
.grid tbody tr:last-child th,.grid tbody tr:last-child td{border-bottom:0}
.hvt{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}.hz{display:flex;gap:6px;margin-left:auto}.hvt .btn.on{background:var(--accent-s);color:var(--accent-d);font-weight:700}
.grid.mth th,.grid.mth td{min-width:54px;padding:2px}.grid.mth th.nm{min-width:92px}.grid.mth .cell{min-height:40px;font-size:11px;padding:2px 1px}.grid.mth .tot{min-width:56px}
.grid.mth th.mon,.grid.mth td.mon{border-left:2px solid #cfd8e3}.grid.mth th.wkd{color:var(--red)}.grid.mth td.wkd{background:#fafbfd}
.scroll.stk{max-height:calc(100vh - 150px);overflow:auto}
.scroll.stk .grid thead th{position:sticky;top:0;z-index:3;box-shadow:0 1px 0 var(--line)}
.scroll.stk .grid thead th.nm{z-index:4}
@media (min-width:900px){.scroll.stk{max-height:none;overflow:visible;overflow:clip}.scroll.stk .grid thead th{top:var(--hh,0px)}}
.grid th.nm{position:sticky;left:0;z-index:1;text-align:left;padding:8px 10px;min-width:92px;font-weight:700;border-right:1px solid var(--line)}
.grid thead th.nm{background:#f8fafc}
.dn{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.dd{display:block;font-size:15px}
.grid tr.me th.nm{color:var(--accent-d)}
.grid tr.me td,.grid tr.me th.nm{background:#f3f9ff}
.grid td.tot,.grid th.tot{font-weight:700;min-width:56px}
.grid tr.pres td,.grid tr.pres th{background:#f8fafc;color:var(--mute);font-size:12px}
.over{color:var(--red)}
.grid.view td{height:44px;font-size:12.5px;font-weight:600}
.c-shift{color:#0b5c9e;background:var(--accent-s)!important}
.c-cm{color:var(--red);background:var(--red-s)!important}
.c-anj{color:#b45309;background:#fff4e0!important}
.c-aj{color:var(--accent-d);background:var(--accent-s)!important}
.hol{color:#c00000!important}
.hol small{display:block;font-size:9px;font-weight:700;line-height:1}
.c-cp,.c-leave{color:var(--violet);background:var(--violet-s)!important}
.c-rf{color:var(--teal);background:var(--teal-s)!important}
.c-fe{color:var(--slate);background:var(--slate-s)!important}
.cell{position:relative;width:100%;min-height:46px;border:0;border-radius:9px;background:#f6f8fb;display:flex;align-items:center;justify-content:center;padding:4px 2px;font-size:12px}
.cell.shift{background:var(--accent-s);color:#0b5c9e;font-weight:700}
.cell.cm{background:var(--red-s);color:var(--red);font-weight:700}
.cell.anj{background:#fff4e0;color:#b45309;font-weight:700}
.cell.aj{background:var(--accent-s);color:var(--accent-d);font-weight:700}
.cell.cp{background:var(--violet-s);color:var(--violet);font-weight:700}
.cell.leave{background:#fff;color:var(--violet);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--violet)}
.cell.rf{background:var(--teal-s);color:var(--teal);font-weight:700}
.cell.fe{background:var(--slate-s);color:var(--slate);font-weight:700}
.cell.warn{box-shadow:inset 0 0 0 2px #e8920c}
.grid.edit td.ce{position:relative}.ok1{position:absolute;left:3px;top:3px;z-index:2;width:20px;height:20px;border-radius:50%;border:0;background:var(--green);color:#fff;font:700 12px/20px sans-serif;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.3)}.ok1:active{filter:brightness(.9)}
.cell:active{filter:brightness(.95)}
.wm{position:absolute;left:4px;top:2px;color:#d97706;font-size:12px;line-height:1.2;font-weight:800}
.hint{position:absolute;right:3px;top:3px;width:15px;height:15px;border-radius:50%;font:700 9px/15px -apple-system,sans-serif;font-style:normal;text-align:center}
.legend .hint,.legend .wm{position:static;display:inline-block}
.av-libre{background:var(--green-s);color:var(--green)}
.av-h{background:var(--amber-s);color:var(--amber)}
.avr{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-size:9px;font-weight:700;color:var(--amber)}
.nt{position:absolute;right:3px;bottom:1px;font-size:9px;color:#2563eb}
.wheelw{position:relative;margin-top:8px}
.wheel{height:220px;overflow-y:auto;scroll-snap-type:y mandatory;padding:88px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wit{height:44px;line-height:44px;text-align:center;scroll-snap-align:center;font-size:19px;font-weight:600;color:#8a96a8;transition:color .12s,font-size .12s;cursor:pointer}
.wit.sel{color:var(--ink);font-size:24px;font-weight:700}
.wsel{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:12px;background:var(--accent-s);pointer-events:none}
.wheel{position:relative;z-index:1}
.avsel{width:100%;margin-top:8px;padding:11px;border:1px solid #d5dce6;border-radius:10px;font-size:15px;background:#fff}
.tpl{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;font-weight:600}
.tpl input{flex:1;min-width:0;padding:9px;border:1px solid #d5dce6;border-radius:10px;font-size:15px}
.av-matin,.av-apres{background:var(--amber-s);color:var(--amber)}
.av-non{background:var(--red-s);color:var(--red)}
.av-leave{background:var(--violet-s);color:var(--violet)}

/* dispos vues gestion */
.dcard{background:#fff;border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 0 0 1px rgba(16,24,40,.04)}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.days7 div{text-align:center;font-size:11px;color:var(--mute);text-transform:uppercase}
.days7 .hint{position:static;display:block;width:auto;height:auto;font-size:14px;line-height:30px;border-radius:8px;margin-top:3px;background-clip:padding-box}
.days7 .hint.none{background:#f1f4f8;color:#aab2bf}
.nl{margin-top:8px;font-size:13px;color:#344054}
.nl li{padding:2px 0}
.nl b{display:inline-block;min-width:34px;color:var(--mute)}

/* équipe */
.etpbig{font-size:44px;font-weight:800;line-height:1.1;color:var(--blue,#0b6fd6)}
.etpbig small{font-size:18px;font-weight:700}
.card.etp .mine{margin-top:8px}
.sub{display:block;font-size:12px;color:var(--mute)}
.cpx{margin-top:10px;padding:10px;border-radius:12px;background:#f1f4f8}
.cpr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.cpf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:14px}
.cpf input{flex:1;min-width:120px;padding:8px;border:1px solid #d5dce6;border-radius:10px;font-size:14px}
.erow{padding:12px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .en{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.erow .en span{font-size:12.5px}
.erow .en b{text-transform:uppercase;font-weight:800;font-size:17px;letter-spacing:.4px}
.erow{padding:16px 0}
.erow label{margin-top:8px}
.eact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* prestations du mois */
textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-height:130px;background:#fff;color:var(--ink);resize:vertical}
.notice.warnn{background:var(--amber-s);color:var(--amber)}
.notice.warnn ul{margin-top:6px}
table.pr{border-collapse:separate;border-spacing:0;width:100%}
.pr th,.pr td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;font-size:14px;font-variant-numeric:tabular-nums;background:#fff}
.pr th:first-child,.pr td:first-child{text-align:left;position:sticky;left:0;z-index:1;min-width:88px}
.pr thead th{background:#f8fafc;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:700}
.pr tr.rw{cursor:pointer}
.pr tr.rw:active td{background:var(--accent-s)}
.pr .sub{display:block;font-size:12px;color:var(--mute);font-weight:500}
.pr .z{color:#b6bdc9}

function absCode(sh){var t=sh&&sh.t;if(t==='CM')t='M';if(t==='FR')t='RF';if(t==='MAI')t='ANJ';return (t&&ABS[t])?t:'';}

/* prestations d'un employé ALRODIS sur un mois : seuls les jours du mois comptent (semaine à cheval coupée) */
function monthCalc(ym,e){
  var r={w:0,m:0,cp:0,rf:0,f:0,aj:0,anj:0,days:0,det:[]},days=monthDays(ym),i,sh,t,mn;
  for(i=0;i<days.length;i++){
    sh=entryOn(e.id,days[i]);if(!sh)continue;
    if(sh.a){mn=shiftMin(sh);r.w+=mn;r.days++;r.det.push({d:days[i],txt:fmtRange(sh),m:mn});}
    else{t=absCode(sh);if(t){mn=Math.round(absH(sh)*60);r[t.toLowerCase()]+=mn;r.det.push({d:days[i],txt:ABS[t].l+' ('+t+')',m:mn});}}

/* agence : semaines entières qui touchent le mois */

  while(w<=end){t+=weekMin(w,e.id);w=addDays(w,7);}
  return t;}
/* congés acceptés dont les jours de semaine n'ont pas encore de code dans l'horaire */
function uncoded(ym){
  var out=[],days=monthDays(ym),first=days[0],last=days[days.length-1];
  allLeaves().forEach(function(l){
    var e,d,end,n=0,dow;
    if(l.s!=='ok')return;
    e=empById(l.e);if(!e||isAgency(e.c)||e.c==='gerant')return;
    if(l.t<first||l.f>last)return;
    d=l.f<first?first:l.f;end=l.t>last?last:l.t;
    while(d<=end){dow=(parse(d).getDay()+6)%7;if(dow<5&&!entryOn(e.id,d))n++;d=addDays(d,1);}

function initData(){
  var raw=lsGet(LS_DATA);

  if(typeof FIREBASE_CONFIG!=='undefined'&&FIREBASE_CONFIG&&typeof firebase!=='undefined'){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      ref=firebase.database().ref(DB_ROOT);useFb=true;syncState='off';
      var fbFirst=true,localInit=null;
      try{localInit=raw?JSON.parse(raw):null;}catch(e2){localInit=null;}
      ref.on('value',function(snap){
        var v=snap.val();
        if(!v&&fbFirst){fbFirst=false;
          /* base vide : on y envoie les données déjà présentes sur cet appareil (ou l'équipe de départ) */
          if(localInit&&localInit.employees&&Object.keys(localInit.employees).length){S=localInit;}else{seedDemo();}
          ref.set(S).catch(fbErr);return;}
        if(fbFirst&&v&&localInit&&localInit.employees){
          /* si cet appareil contient plus de données que la base (équipe, horaires, congés), on garde celles de l'appareil et on les envoie */
          var sc=function(o){var n=0,k;for(k in {employees:1,weeks:1,leaves:1}){if(o&&o[k])n+=Object.keys(o[k]).length;}return n;};
          if(sc(localInit)>sc(v)){fbFirst=false;S=localInit;ref.set(S).catch(fbErr);return;}}
        fbFirst=false;
        S=v||{};lsSet(LS_DATA,JSON.stringify(S));loaded=true;scheduleRender();},function(){setSync('err');});
      firebase.database().ref('.info/connected').on('value',function(s){setSync(s.val()?'ok':'off');});
      setTimeout(function(){if(!loaded){loaded=true;scheduleRender();}},3000);
    }catch(e){useFb=false;}
  }
  if(!useFb){loaded=true;syncState='test';
    /* anciennes données de démonstration (prénoms fictifs) : remplacées par l'équipe ALRODIS */
    if(raw&&isOldDemo())seedDemo();
    if(!raw)seedDemo();}

ne avant le début de ce mois</b>. Utilisez les flèches en haut pour passer d’une semaine à l’autre. Un <b>bandeau en haut de l’appli</b> vous rappelle ce qu’il reste à remplir : il devient rouge si vous êtes en retard.</p></div></details><details class=\"gd\"><summary>3. Mes congés : demander un congé</summary><div class=\"gb\"><figure class='gi gs'><img src='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAL4AYYDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAIEAQMFBgcI/8QAThAAAQMDAQQECQsDAwIEBAcAAQACAwQFERIGEyExQVFxkRQiMlJTYWKS0QcVFjNUVYGTo7HhcqHSI0LBgvAXJCWyNTbT8SZDRHN0daL/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/8QAMhEBAAEDAQYEBQQCAwEAAAAAAAECAxFREhMVIaHRBDFBYQVScbHwIjLB4RQzNJHxgf/aAAwDAQACEQMRAD8A+3oiKoIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiIPFVPykUENxuFFDZb7Vut8ro6mWlpGyRsIzxJDuA4HmByXpbDeqHaC1xXG2S7ynlyASMFpHMEdBC+W2CC8z7Ubbtst6pLYTXEPNRCHlxzJggk8Mceg81yILq0fJ1bLVbt5b6aW8+A3Cojl1awQHFwdw4EEe71K4H3lF8kZbotj/lAjs9hnm8Ar7ZLJVU75C/Q5rHkP8AUSWjvPWvMx2drvklj2nNbW/OVHNincJyGxjfacAf9ROeeVMD7eLlUHaA2z5sqRTCn3vh/DdF2caO3/vHSukvk0lzrWbfVNdE4vqG7LmoYzoMmkOHDtXnZ7bBS/J7SbcQ3SqO0LqgPNQZydbjIQWY7BnHqPQmB97RfNrPWv8A/GCrdWv3O9sjHbt7sAO lié, rien n’est affiché : c’est normal.</p><p>Codes utilisés : <b>CP</b> = congé payé, <b>F</b> = jour férié, <b>RF</b> = récupération d’un férié, <b>CM</b> = certificat médical (maladie), <b>AJ</b> = absence justifiée, <b>ANJ</b> = absence non justifiée. Les jours fériés belges sont repérés automatiquement.</p></div></details><details class=\"gd\"><summary>5. Pauses</summary><div class=\"gb\"><p>Une pause de <b>15 minutes</b> est déduite uniquement si la journée de travail dépasse <b>6 heures</b>, conformément à la loi belge.</p></div></details><details class=\"gd\"><summary>6. Questions fréquentes</summary><div class=\"gb\"><ul><li><b>Je me suis trompé dans mes dispos</b> : retournez dans « Mes dispos » et modifiez, tant que l’horaire de la semaine n’est pas fait.</li><li><b>Je ne vois pas l’horaire</b> : il n’est pas encore publié.</li><li><b>Mon prénom n’est pas dans la liste</b> : prévenez la gestion.</li><li><b>Un problème, une question ou une idée pour améliorer l’appli ?</b> Dites-le à Alex ou Fabienne : vos retours servent à l’adapter.</li><li><b>Mon horaire ne me convient pas</b> : libre à vous de vous arranger avec vos collègues. Si un arrangement est trouvé, signalez-le dans l’onglet <b>Horaire</b> (bouton « Signaler un échange »), <b>assez tôt</b> pour que l’horaire soit adapté : jamais le jour même. L’horaire ne change que quand la gestion l’a modifié.</li><li><b>Personne d’autre ne peut modifier mes dispos ni mes congés</b>, à part la gestion.</li></ul></div></details>";
var GUIDE_MGR="<details class=\"gd\" open><summary>1. Premier démarrage et codes</summary><div class=\"gb\"><ul><li>Le <b>code de gestion</b> (4 à 8 chiffres) se crée à la première entrée dans l’« Espace gestion » (bouton en bas de l’accueil). Alex et Fabienne ont <b>chacun leur code personnel</b> : choisissez votre nom puis entrez votre code. La première fois, entrez d’abord le code d’un gérant existant, puis créez le vôtre. Ne communiquez jamais ces codes au personnel. Code oublié : l’autre gérant le réinitialise dans <b>Équipe → Accès gestion</b>.</li><li>Chaque employé crée lui-même son code à 4 chiffres. En cas d’oubli, remettez-le à zéro dans l’onglet <b>Équipe</b>.</li><li>Alex et Fabienne n’apparaissent <b>jamais</b> côté personnel (liste d’accueil, horaire, image). Vous êtes visibles uniquement ici et dans l’Excel.</li></ul></div></details><details class=\"gd\"><summary>2. Flux de travail d’une semaine</summary><div class=\"gb\"><figure class='gi'><img src='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAKAA4QDASIAAhEBAxEB/8QAHAABAAEFAQEAAAAAAAAAAAAAAAIBAwQFBgcI/8QARxAAAQMCBAMFBQQIBQMDBQEAAAECAwQRBRITIQYxkUFRUlOSFCIyYXEHgaHBFRYXI0JUYtIzVZOksXKi0SQ2 lM/tt+S/sQJz+235L+xA3CyAAIGH+w75GTD/AGHfID1AAy0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAFS6WUACpYGL4p8h6OzxcWgUmmFXo7PFwSBieK/MtAo0wIlksgACqZ/bb8l/YgTn9tvyX9iBqEkAAR//9k=' alt='Dispos : ce que chacun a indiqué pour la semaine.' loading='lazy'><figcaption>Dispos : ce que chacun a indiqué pour la semaine.</figcaption></figure><ol><li>Les employés remplissent leurs <b>dispos</b> et leurs <b>congés</b>.</li><li>Onglet <b>Congés</b> : acceptez ou refusez les demandes en attente.</li><li>Onglet <b>Dispos</b> : consultez ce que chacun a indiqué. Le bloc en haut montre qui n’a pas encore rempli le mois suivant (date limite : 1 semaine avant le début du mois). Le bouton <b>Relancer</b> prépare un message pour Messenger ou WhatsApp. Le personnel voit aussi un bandeau de rappel dans l’appli.</li><li>Onglet <b>Horaire</b> : touchez une case pour y placer un horaire (menu des horaires habituels, ou « Autre »), ou un code (CP, F, RF, CM, AJ, ANJ).</li><li>Vérifiez les avertissements, puis <b>Publier</b> : le personnel voit alors la semaine.</li><li>Générez l’<b>image</b> de l’horaire (personnel, Team One) et envoyez-la : bouton <b>Partager</b> ou <b>Messenger</b> (sur téléphone, choisissez Messenger puis le groupe du personnel).</li></ol></div></details><details class=\"gd\"><summary>3. Onglet Horaire</summary><div class=\"gb\"><figure class='gi'><img src='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAA éclarée (L, M, A, H, pas dispo). « ! » = horaire hors dispo, crayon = note de l’employé.</figcaption></figure><ul><li><b>Semaine / Mois complet</b> : les deux boutons en haut de l’onglet Horaire permettent de voir toute la semaine ou tout le mois d’un coup (les jours restent figés en haut). Les cases du mois se modifient aussi d’un toucher. Les boutons <b>−</b> / <b>+</b> réduisent ou agrandissent le tableau, et <b>Tout le mois</b> l’ajuste à l’écran pour voir les 31 jours d’un coup. Publier, imprimer et valider les dispos se font en vue Semaine.</li><li><b>Activité</b> : l’onglet « Activité » liste ce que le personnel a fait (dispos remplies, demandes de congé, échanges signalés) ; le badge rouge indique le nombre de nouveautés depuis votre dernière visite sur cet appareil. Il n’y a pas de notification sur le téléphone : ouvrez l’application pour voir les nouveautés.</li><li><b>Validation rapide</b> : quand un employé a donné des dispos en heures (ex. 14h-20h) pour un jour encore vide, un <b>✓ vert</b> apparaît dans la case : un seul toucher place cet horaire. Le bouton « Valider toutes les dispos en heures » le fait pour toute la semaine (les jours de congé, hors contrat ou déjà remplis sont ignorés). Vous pouvez toujours toucher la case pour choisir un autre horaire.</li><li>Chaque case affiche l’horaire, avec une pastille si l’employé a laissé une précision.</li><li><b>Alertes</b> : « hors disponibilité » (l’horaire placé est en dehors de ce que l’employé a indiqué) et « hors période de contrat ».</li><li>Pause de 15 min déduite seulement pour un horaire de plus de 6 h (fin à :15).</li><li><b>AJ</b> = absence justifiée : comptée comme absence <b>payée</b>. <b>ANJ</b> = absence non justifiée : <b>non payée</b>, exclue des heures payées.</li><li>Jours fériés belges : détectés automatiquement (FERIE dans l’image, l’en-tête et l’Excel).</li></ul></div></details><details class=\"gd\"><summary>4. Onglet Prestations et exports Excel</summary><div class=\"gb\"><figure c /* ---------- ETP : équivalents temps plein, exacts sur n'importe quelle période ----------
   Chaque jour appartient à une seule période : ETP = heures de la période ÷ (temps plein hebdo × nb de jours ÷ 7).
   Une semaine à cheval sur deux mois est donc coupée au jour près. */
function ftwH(){return +getp(S,['cfg','ftw'])||38;}
function etpMin(f,t){
  var r={ag:0,ot:0,agA:0,otA:0,days:0},d=f,list=allEmps().filter(function(e){return e.c!=='gerant';}),i,e,sh,c,m;
  while(d<=t){
    r.days++;
    for(i=0;i<list.length;i++){e=list[i];if(e.out&&d>e.out)continue;sh=entryOn(e.id,d);if(!sh)continue;
      if(sh.a){m=shiftMin(sh);if(isAgency(e.c))r.ag+=m;else r.ot+=m;}
      else{c=absCode(sh);if(c&&c!=='ANJ'&&!(e.mu&&d>=e.mu)){m=Math.round(absH(sh)*60);if(isAgency(e.c))r.agA+=m;else r.otA+=m;}}}
    d=addDays(d,1);}
  return r;}
/* ETP contractuel (comparaison avec le bilan social) : heures de contrat par semaine ÷ temps plein, moyenne jour par jour sur la période.
   Personnel ALRODIS seulement (hors agence, hors gérants) ; un contrat suspendu (maladie, mutuelle) compte tant que la personne n'est pas sortie. */
function etpContract(f,t){
  var list=allEmps().filter(function(e){return e.c!=='gerant'&&!isAgency(e.c);}),d=f,days=0,sum=0,ft=ftwH(),i,e,eh,miss={},cnt={};
  while(d<=t){
    days++;
    for(i=0;i<list.length;i++){e=list[i];
      if(e.out&&d>e.out)continue;
      if(!e.a&&!e.out)continue;
      if(!inContract(e,d))continue;
      eh=cpWeekH(e,d)||e.h;
      if(eh>0){sum+=eh/ft;cnt[e.id]=1;}else{miss[e.id]=e.n;}}
    d=addDays(d,1);}
  return {etp:days?sum/days:0,n:Object.keys(cnt).length,miss:Object.keys(miss).filter(function(k){return !cnt[k];}).map(function(k){return miss[k];})};}
function etpAllMin(r){return r.ag+r.ot+r.agA+r.otA;}
function etpVal(min,days){return days>0?min/60/(ftwH()*days/7):0;}
function etpBounds(){
  var m=V.em,y,ym,l;
  if(m==='week')return {f:V.ewk,t:addDays(V.ewk,6),l:'Semaine '+isoWeek(V.ewk)+' · '+weekRange(V.ewk)};
  if(m==='year')return {f:V.eyr+'-01-01',t:V.eyr+'-12-31',l:'Année '+V.eyr};
  if(m==='custom'){if(V.ef&&V.et&&V.ef<=V.et)return {f:V.ef,t:V.et,l:'Du '+dmy(V.ef)+' au '+dmy(V.et)};return null;}
  ym=V.emo;y=ym.split('-');return {f:ym+'-01',t:monthDays(ym)[monthDays(ym).length-1],l:MONF[+y[1]-1]+' '+y[0]};}

  bs=etpContract(b.f,b.t);
  h+='<div class="card"><h2>Pour comparer aux bilans sociaux</h2><div class="mine"><b>Personnel ALRODIS : ETP contractuel</b><span>'+fmtN(bs.etp)+' ETP</span></div><p class="mute" style="margin:4px 0 8px">Heures de contrat par semaine ÷ '+ftwH()+' h, moyenne sur la période ('+bs.n+' personne(s)). Se règle dans Équipe : « Heures de contrat par semaine ».'+(bs.miss.length?' <b>Sans heures de contrat, non comptés : '+esc(bs.miss.join(', '))+'.</b>':'')+'</p><div class="mine"><b>Personnel ALRODIS : heures effectivement prestées</b><span>'+fmtH(r.ot)+' h</span></div><div class="mine"><b>Intérim / flexis d’agence (Team One) : heures prestées</b><span>'+fmtH(r.ag)+' h · '+fmtN(etpVal(r.ag,r.days))+' ETP</span></div><p class="mute" style="margin:8px 0 0">« Heures prestées » = sans congés, fériés ni absences, comme dans le bilan social.</p></div>';
  mu=emps().filter(function(e){return e.mu;});
  if(mu.length)h+='<p class="count">Absences exclues (payé par la mutuelle) : '+mu.map(function(e){return esc(e.n)+' depuis le '+dmy(e.mu);}).join(', ')+'.</p>';

  if(V.em==='year'){

    if(rows)h+='<h2 class="sec">Mois par mois</h2><div class="scroll"><table class="pr"><thead><tr><th>Mois</th><th>Heures</th><th>ETP</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }else{
    w=iso(mondayOf(parse(b.f)));wEnd=b.t;ri=0;
    while(w<=wEnd&&ri<60){
      rr=etpMin(w,addDays(w,6));mm=etpMin(w>b.f?w:b.f,addDays(w,6)<b.t?addDays(w,6):b.t);
      if(etpAllMin(rr))rows+='<tr><td>S'+isoWeek(w)+'<span class="sub">'+weekRange(w)+(mm.days<7?' · '+mm.days+' j dans la période':'')+'</span></td><td>'+fmtH(etpAllMin(rr))+' h</td><td><b>'+fmtN(etpVal(etpAllMin(rr),7))+'</b></td></tr>';
      w=addDays(w,7);ri++;}
    if(rows)h+='<h2 class="sec">Semaine par semaine (semaines entières)</h2><div class="scroll"><table class="pr"><thead><tr><th>Semaine</th><th>Heures</th><th>ETP</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  h+='<div class="card"><label>Temps plein de référence (h par semaine)<input type="number" min="1" max="60" step="0.5" inputmode="decimal" data-chg="ftw" value="'+ftwH()+'"></label><label>Référence 2025 : intérim (ETP)<input type="number" min="0" step="0.01" inputmode="decimal" data-chg="etpi" value="'+(getp(S,['cfg','etpI'])||'')+'"></label><label>Référence 2025 : autres (ETP)<input type="number" min="0" step="0.01" inputmode="decimal" data-chg="etpa" value="'+(getp(S,['cfg','etpA'])||'')+'"></label></div>';

  return h;}

function etpWrite(X,xml,c0,wk,info){

    case 'lv-wait':put('leaves/'+id+'/s','p');break;
    case 'lv-cancel':if(confirm('Annuler cette demande ?'))put('leaves/'+id,null);break;
    case 'pin-reset':if(confirm('Réinitialiser le code ? L’employé en créera un nouveau à sa prochaine connexion.')){put('employees/'+id+'/pin',null);toast('Code réinitialisé');}break;
    case 'archive':if(confirm('Retirer cet employé de l’équipe ? Son historique est conservé (horaires, prestations et ETP passés).'))put('employees/'+id+'/a',false);break;
    case 'ep-mode':V.em=v;if(v==='custom'&&!V.ef){V.ef=V.emo+'-01';V.et=monthDays(V.emo)[monthDays(V.emo).length-1];}render();break;
    case 'ep-nav':(function(n){if(V.em==='week')V.ewk=addDays(V.ewk,7*n);else if(V.em==='year')V.eyr+=n;else V.emo=addMonth(V.emo,n);})(+el.getAttribute('data-n'));render();break;
    case 'pin-ok':onLogin(byId('pin')?byId('pin').value:'');break;
    case 'cp-add':cpAdd(id);break;
    case 'cp-del':cpDel(id,+v);break;
    case 'restore':put('employees/'+id+'/a',true);break;
    case 'xlo-save':put('cfg/xlo',(byId('xlot').value.replace(/^\s+|\s+$/g,''))||'-');toast('Ordre enregistré');break;
    case 'import-team':importTeam();break;
    case 'mo':V.mo=addMonth(V.mo,+el.getAttribute('data-n'));V.openP='';render();break;
    case 'open':V.openP=(V.openP===id)?'':id;render();break;
    case 'prest-csv':prestCsv();break;
    case 'month-xlsx':monthXlsxRun();break;
    case 'img-all':makeImg(false);break;
    case 'img-agency':makeImg(true);break;
    case 'img-dl':if(IMG)dlBlob(IMG.blob,IMG.name);break;
    case 'img-share':shareImg();break;
    case 'img-msn':msnImg();break;
    case 'close-ov':closeOv();break;
    case 'xl-open':V.xl={state:'pick'};render();break;
    case 'xl-dl':if(XLBLOB)dlBlob(XLBLOB,XLNAME);break;
    case 'xl-again':V.xl={state:'pick'};render();break;
  }
}

APP.addEventListener('scroll',function(ev){
  var t=ev.target,k,its,i,wl=whoList(),b;
  if(!t||t.id!=='wheel')return;
  k=Math.max(0,Math.min(Math.round(t.scrollTop/44),wl.length-1));
  if(k===V.whoIdx&&t.querySelector('.sel')&&+t.querySelector('.sel').getAttribute('data-k')===k)return;
  V.whoIdx=k;its=t.children;for(i=0;i<its.length;i++){if(i===k)its[i].className='wit sel';else its[i].className='wit';}
  b=APP.querySelector('.wok');if(b&&wl[k])b.textContent='C’est moi, '+wl[k].n;
},true);
APP.addEventListener('click',function(ev){
  var el=ev.target;
  while(el&&el!==APP&&!(el.getAttribute&&el.getAttribute('data-act')))el=el.parentNode;
  if(!el||el===APP)return;
  act(el.getAttribute('data-act'),el);
});
APP.addEventListener('change',function(ev){
  var t=ev.target,c=t.getAttribute&&t.getAttribute('data-chg'),v,me,cur,x;
  if(!c)return;
  if(c==='note'){
    me=curEmp();if(!me)return;
    x=t.getAttribute('data-d');v=t.value.replace(/^\s+|\s+$/g,'');
    cur=getp(S,['weeks',V.wk,'avail',me.id,'d'+x])||{};
    put('weeks/'+V.wk+'/avail/'+me.id+'/d'+x,(cur.s||v)?hrs({s:cur.s||'',n:v},cur):null);
  }else if(c==='avp'){
    me=curEmp();if(!me)return;
    try{t.blur();}catch(er){}
    x=t.getAttribute('data-d');cur=getp(S,['weeks',V.wk,'avail',me.id,'d'+x])||{};
    if(!t.value){put('weeks/'+V.wk+'/avail/'+me.id+'/d'+x,cur.n?{s:'',n:cur.n}:null);}
    else{v={s:'h',n:cur.n||'',a:'',b:''};
      if(t.value==='x'){v.x=1;if(cur.s==='h'){v.a=cur.a||'';v.b=cur.b||'';}}
      else{v.a=t.value.split('|')[0];v.b=t.value.split('|')[1];}
      put('weeks/'+V.wk+'/avail/'+me.id+'/d'+x,v);}
    toast('Enregistré');
  }else if(c==='avt'){
    me=curEmp();if(!me)return;
    if(t.value){try{t.blur();}catch(er){}}
    x=t.getAttribute('data-d');cur=getp(S,['weeks',V.wk,'avail',me.id,'d'+x])||{};
    {v=hrs({s:'h',n:cur.n||''},cur);v[t.getAttribute('data-k')]=t.value;
      if(v.a&&v.b&&toMin(v.b)<=toMin(v.a)){toast('L’heure de fin doit être après le début');render();return;}
      put('weeks/'+V.wk+'/avail/'+me.id+'/d'+x,v);toast('Enregistré');}
  }else if(c==='contract'){
    v=parseFloat(String(t.value).replace(',','.'));
    put('employees/'+t.getAttribute('data-id')+'/h',v>0?v:null);
  }else if(c==='pickemp'){
    if(t.value){var pid=t.value;t.blur();V.screen='login';V.loginFor=pid;V.pinStep=0;V.pinTmp='';V.pinErr='';render();}
  }else if(c==='bkfile'){
    if(t.files&&t.files[0])bkRestore(t.files[0]);
    t.value='';
  }else if(c==='xlfile'){
    if(t.files&&t.files[0])xlRun(t.files[0]);
  }else if(c==='ctype'){
    put('employees/'+t.getAttribute('data-id')+'/c',t.value||null);
  }else if(c==='epf'||c==='ept'){
    if(c==='epf')V.ef=t.value;else V.et=t.value;render();
  }else if(c==='ftw'){
    v=parseFloat(String(t.value).replace(',','.'));put('cfg/ftw',(v>=1&&v<=60)?v:null);
  }else if(c==='etpi'||c==='etpa'){
    v=parseFloat(String(t.value).replace(',','.'));put(c==='etpi'?'cfg/etpI':'cfg/etpA',(v>0)?v:null);
  }else if(c==='outd'){
    put('employees/'+t.getAttribute('data-id')+'/out',t.value||null);
  }else if(c==='mut'){
    put('employees/'+t.getAttribute('data-id')+'/mu',t.value||null);
  }else if(c==='alday'){
    v=parseInt(t.value,10);put('cfg/al',(v>=1&&v<=90)?v:null);
  }else if(c==='cnote'){
    put('employees/'+t.getAttribute('data-id')+'/cn',t.value.replace(/^\s+|\s+$/g,'')||null);
  }
});
APP.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='pin'){t.value=t.value.replace(/\D/g,'');if(V.loginFor!=='mgr'&&t.value.length===4)onLogin(t.value);}
});
APP.addEventListener('submit',function(ev){
  ev.preventDefault();
  var f=ev.target.getAttribute('data-form');
  if(f==='pin')onLogin(byId('pin').value);
  else if(f==='leave')submitLeave();
  else if(f==='swap')submitSwap();
  else if(f==='addemp')addEmp();
  else if(f==='mgrpin')changeMgrPin();
});

/* ---------- démarrage ---------- */
initData();
try{
  var sess=JSON.parse(lsGet(LS_SESS)||'null');
  if(sess&&sess.r==='mgr'){V.screen='mgr';V.mgrWho=sess.id||'';}
  else if(sess&&sess.r==='emp'&&sess.id){V.screen='emp';V.loginFor=sess.id;}
}catch(err){}
render();
})();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
